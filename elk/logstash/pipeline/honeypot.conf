# Pipeline Logstash — ingestion logs Cowrie & Dionaea

input {
  file {
    path => "/logs/cowrie/cowrie.json*"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_cowrie"
    codec => json
    tags => ["cowrie", "honeypot"]
  }

  file {
    path => "/logs/dionaea/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_dionaea"
    tags => ["dionaea", "honeypot"]
  }
}

filter {
  if "cowrie" in [tags] {
    mutate {
      add_field => { "honeypot" => "cowrie" }
      add_field => { "attack_type" => "%{eventid}" }
    }

    if [src_ip] {
      mutate { copy => { "src_ip" => "attacker_ip" } }
    }
  }

  if "dionaea" in [tags] {
    mutate {
      add_field => { "honeypot" => "dionaea" }
    }

    grok {
      match => {
        "message" => [
          "connection from %{IPORHOST:attacker_ip}:%{INT:src_port}",
          "accept connection from %{IPORHOST:attacker_ip}:%{INT:src_port}"
        ]
      }
      tag_on_failure => []
    }
  }

  if [attacker_ip] {
    mutate { add_field => { "[@metadata][ioc_ip]" => "%{attacker_ip}" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "honeypot-attacks-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => dots
  }
}
